# goreleaser config — https://goreleaser.com
# Run `goreleaser release --clean` on a tagged commit to publish a GitHub
# Release with cross-built binaries for macOS / Linux on amd64 / arm64.

version: 2

project_name: collab-ai

before:
  hooks:
    - go mod tidy

builds:
  - id: collab
    main: ./cmd/collab
    binary: collab
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^style:"
      - "merge conflict"
      - Merge pull request
  groups:
    - title: Features
      regexp: "^.*feat[(\\w)]*:.*$"
      order: 0
    - title: Fixes
      regexp: "^.*fix[(\\w)]*:.*$"
      order: 1
    - title: Other
      order: 999

release:
  github:
    owner: Aman035
    name: collab-ai
  draft: false
  prerelease: auto
  header: |
    ## collab-ai {{ .Tag }}

    Multiplayer for AI coding agents — peer-to-peer over Gensyn Axl.
  footer: |
    **Install:**
    ```bash
    go install github.com/Aman035/collab-ai/cmd/collab@{{ .Tag }}
    ```
    Or grab the prebuilt `collab` binary from the assets below.

    On first `collab create` / `collab connect`, the Gensyn Axl daemon
    is built into `~/.collab/bin/axl-node` automatically — no separate
    install step.
