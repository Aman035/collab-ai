<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="collab logo: two peers connected by a wire">
  <!--
    Two circles, one filled (you), one outlined (peer), connected by a wire.
    Reads as "collab" / "P2P". Single teal accent. Transparent background so
    it works on light, dark, paper, and pure black surfaces.
  -->
  <g fill="none" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="32" r="9" fill="#0d9488"/>
    <line x1="25" y1="32" x2="39" y2="32"/>
    <circle cx="48" cy="32" r="9"/>
  </g>
</svg>
