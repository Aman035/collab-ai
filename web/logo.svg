<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="collab">
  <title>collab</title>
  <!--
    Split disc. Left half is a solid disc, right half is an open ring,
    sharing one center axis. Reads as "two halves of one whole" without
    being a literal network diagram. currentColor inherits from parent
    so the same mark works on dark, light, and paper surfaces.
  -->
  <path d="M 32 11 A 21 21 0 0 0 32 53 Z" fill="currentColor"/>
  <path d="M 32 11 A 21 21 0 0 1 32 53" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/>
</svg>
